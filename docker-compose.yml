services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-internship-tracker-postgres
    environment:
      POSTGRES_DB: smart_internship_tracker
      POSTGRES_USER: smart_tracker
      POSTGRES_PASSWORD: smart_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_tracker -d smart_internship_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: